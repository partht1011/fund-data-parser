services:
  backend:
    build: ./backend
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/visual_alpha.db
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-mistral-ocr-latest}
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - parser-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  parser-data:
