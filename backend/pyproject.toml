[project]
name = "visual-alpha-parser"
version = "0.1.0"
description = "Configuration-driven mutual fund Schedule of Investments parser"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "pycountry>=24.6,<25",
  "pdfplumber>=0.11,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
document = [
  "liteparse>=0.1.2",
  "docling>=2.40",
]
remote = ["mistralai>=2.4,<3"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
